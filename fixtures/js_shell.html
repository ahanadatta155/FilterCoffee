<!doctype html><html><head><title>Rendered quotes</title></head><body>
<div id="app"></div><noscript>You need to enable JavaScript to run this app.</noscript>
<script>setTimeout(() => {
  document.querySelector('#app').innerHTML = Array.from({length: 10}, (_, i) =>
    `<article class="quote"><p>Quote number ${i + 1}: keep exploring.</p><span>Author ${i + 1}</span></article>`).join('');
}, 300);</script></body></html>
