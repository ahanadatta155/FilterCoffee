<!doctype html><html><head><title>Controlled vision test</title></head><body>
<canvas id="table" width="1000" height="500" aria-label="Controlled vision test"></canvas>
<script>
const ctx = document.querySelector('#table').getContext('2d');
ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, 1000, 500);
ctx.fillStyle = '#111111'; ctx.font = '26px sans-serif';
ctx.fillText('Product                 Price USD        Stock', 30, 60);
[['Notebook', '7.50', 'In stock'], ['Pen', '2.00', 'In stock'], ['Pencil', '1.25', 'Out of stock'],
 ['Eraser', '0.80', 'In stock'], ['Ruler', '3.00', 'In stock']].forEach((r, i) => {
  const y = 120 + i * 65;
  ctx.fillText(r[0], 30, y); ctx.fillText(r[1], 380, y); ctx.fillText(r[2], 620, y);
});
</script></body></html>
